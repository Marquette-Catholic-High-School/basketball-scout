# Basketball Scout - nginx reverse proxy in front of uvicorn.
#
# This is a TEMPLATE. `sudo scripts/install.sh --with-nginx [--domain NAME]` fills in
# the @...@ placeholders and installs it as /etc/nginx/sites-available/basketball-scout.
# HTTPS: run certbot afterwards (see README.md > Security). install.sh leaves a site
# that certbot has edited alone, so re-running install.sh keeps your certificate.
#
# Check and apply changes: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80@DEFAULT_SERVER@;
    listen [::]:80@DEFAULT_SERVER@;
    server_name @SERVER_NAME@;

    # Film is uploaded in chunks of SCOUT_UPLOAD_CHUNK_MB (16 MB by default) per
    # request, so 64m leaves plenty of room. A bigger chunk size needs a bigger limit
    # here, or uploads fail with "413 Request Entity Too Large".
    client_max_body_size 64m;
    # Stream each upload chunk straight to the app instead of saving it to disk first.
    proxy_request_buffering off;
    client_body_timeout 300s;

    # Generous timeouts: slow school uplinks, long video playback, big exports.
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Video seeking: pass the browser's Range requests to the app, which answers
    # with 206 Partial Content.
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Game film and annotated video: stream the bytes through instead of buffering a
    # multi-gigabyte file in nginx's temp folder.
    location ~ ^/api/games/[^/]+/video$ {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
    }
}
